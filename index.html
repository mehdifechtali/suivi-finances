<!DOCTYPE html>
<!-- La ligne au-dessus dit au navigateur : "ceci est une page HTML moderne". -->
<html lang="fr">
<head>
  <!-- Le <head> contient les réglages de la page, invisibles à l'écran. -->
  <meta charset="UTF-8">
  <!-- Pour que la page s'adapte à la largeur d'un téléphone. -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Le nom affiché dans l'onglet du navigateur. -->
  <title>Suivi Finances</title>
</head>
<body>
  <!-- Le <body> contient tout ce qu'on voit à l'écran. -->
  <h1>Suivi Finances</h1>
  <p>Mon tableau de bord : recettes, dépenses, dettes, projets et prévisions.</p>
  <p>Brique 1 terminée : la page est en ligne.</p>
</body>
</html>
